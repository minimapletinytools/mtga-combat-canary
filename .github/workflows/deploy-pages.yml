name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/data/**'
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight; a new push supersedes an in-progress one rather
# than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # Scoped to @mtgatricks/web and its workspace dependencies (core, data)
      # — skips apps/desktop entirely, so Electron's ~100MB binary is never
      # downloaded here.
      - run: pnpm install --frozen-lockfile --filter "@mtgatricks/web..."

      - run: pnpm --filter "@mtgatricks/web..." run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
